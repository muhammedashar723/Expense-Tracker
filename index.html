<!DOCTYPE html>
<html>
<head>
<title>Expense Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
<h2 class="text-center">Expense Tracker</h2>
<h5>Total Expense:<span id="total">0</span></h5>
<input type="text" id="name" class="form-control mb-2" placeholder="Expense Name">
<input type="number" id="amount" class="form-control mb-2" placeholder="Amount">
<select id="category" class="form-control mb-2">
<option value="">Select Category</option>
<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Other</option>
</select>
<input type="date" id="date" class="form-control mb-2">
<button onclick="addExpense()" id="btn" class="btn btn-primary">Add Expense</button>
<h5 class="mt-4">Filter by Category</h5>
<select id="filter" class="form-control mb-3" onchange="display()">
<option value="">All Categories</option>
<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Other</option>
</select>
<table class="table table-bordered text-center">
<thead>
<tr><th>Name</th><th>Amount</th><th>Category</th><th>Date</th><th>Action</th></tr>
</thead>
<tbody id="output"></tbody>
</table>
</div>
<script src="script.js"></script>
</body>
</html>
